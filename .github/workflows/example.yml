name: AI Code Review (example / self-test)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          # On push to main, only build and cache the repository summary.
          mode: ${{ github.event_name == 'push' && 'summarize' || 'review' }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
